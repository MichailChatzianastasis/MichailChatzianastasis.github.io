{% include base_path %}

<header class="site-nav" role="banner">
  <div class="site-nav__wrap">
    <a class="site-nav__brand" href="{{ base_path }}/">
      <span class="site-nav__brand-mark">MC</span>
      <span class="site-nav__brand-name">{{ site.title }}</span>
    </a>

    <button class="site-nav__burger" aria-label="Toggle menu" aria-expanded="false" aria-controls="site-nav-links">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
    </button>

    <ul id="site-nav-links" class="site-nav__links">
      {% for link in site.data.navigation.main %}
        {% if link.url contains 'http' %}
          {% assign domain = '' %}
        {% else %}
          {% assign domain = base_path %}
        {% endif %}
        <li><a href="{{ domain }}{{ link.url }}">{{ link.title }}</a></li>
      {% endfor %}
      <li>
        <button class="site-nav__theme" id="theme-toggle" aria-label="Toggle dark mode" type="button">
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
        </button>
      </li>
    </ul>
  </div>
</header>

<script>
  (function() {
    var btn = document.getElementById('theme-toggle');
    var burger = document.querySelector('.site-nav__burger');
    var links = document.getElementById('site-nav-links');

    if (btn) {
      btn.addEventListener('click', function() {
        var current = document.documentElement.getAttribute('data-theme') || 'light';
        var next = current === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        try { localStorage.setItem('theme', next); } catch (e) {}
      });
    }

    if (burger && links) {
      burger.addEventListener('click', function() {
        var open = links.classList.toggle('is-open');
        burger.setAttribute('aria-expanded', open ? 'true' : 'false');
      });
      links.addEventListener('click', function(e) {
        if (e.target.tagName === 'A') {
          links.classList.remove('is-open');
          burger.setAttribute('aria-expanded', 'false');
        }
      });
    }
  })();
</script>
