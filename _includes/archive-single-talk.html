{% include base_path %}

<div class="talk-row">
  <div>
    <div class="talk-row__date">{{ post.date | date: '%b %Y' }}</div>
    {% if post.type %}<div style="font-size:0.72rem; color: var(--text-subtle); margin-top: 0.2rem; text-transform: uppercase; letter-spacing: 0.05em;">{{ post.type }}</div>{% endif %}
  </div>
  <div>
    <div class="talk-row__venue">{{ post.title }}</div>
    <p class="talk-row__title">
      {% if post.link %}
        <a href="{{ post.link }}" target="_blank" rel="noopener">{{ post.venue }}</a>
      {% else %}
        {{ post.venue }}
      {% endif %}
      {% if post.location %} · <span style="color: var(--text-subtle);">{{ post.location }}</span>{% endif %}
    </p>
  </div>
</div>
